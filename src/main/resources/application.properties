spring.application.name=golf-course-api

#Database settings.
#These read an environment variable first,
#and fall back to the value after the colon.
#That way switching to AWS RDS is just an
#env var change, no code change.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/golfclub}
spring.datasource.username=${DB_USERNAME:golfadmin}
spring.datasource.password=${DB_PASSWORD:golfpassword}

#create-drop rebuilds the tables every time
#the app starts, so data.sql always loads
#into a clean database.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

#Run data.sql after the tables are made.
#"always" is needed because Spring only runs
#data.sql by itself on in-memory databases,
#not on a real Postgres.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

#Show dates as 2026-08-14
spring.jackson.serialization.write-dates-as-timestamps=false
